[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "rice-disease-hybrid-cnn-vit"
version = "0.1.0"
description = "Rice leaf disease classification with CNN, ViT, and Hybrid CNN-ViT"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "pandas>=2.0", "Pillow>=10", "scikit-learn>=1.3", "matplotlib>=3.7", "PyYAML>=6", "tqdm>=4.66"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"
